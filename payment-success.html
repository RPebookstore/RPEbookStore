<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
<link rel="icon" type="image/jpeg" href="./favicon.png.jpg?v=2">
  <title>Payment Verification</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 420px;
      margin: 40px auto;
      box-shadow: 0 0 10px #ccc;
    }

    h2 {
      margin-bottom: 15px;
    }

    #status {
      margin: 20px 0;
      line-height: 1.7;
    }

    #download {
      display: none;
      text-decoration: none;
    }

    .download-btn {
      display: inline-block;
      background: #16a34a;
      color: white;
      border: none;
      padding: 13px 22px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .download-btn:hover {
      background: #15803d;
    }

  </style>

</head>


<body>

  <div class="box">

    <h2 id="heading">
      Payment Verification
    </h2>

    <p id="status">
      Payment verify ho raha hai...
    </p>

    <a
      id="download"
      target="_blank"
      rel="noopener"
    >

      <span class="download-btn">
        📥 Download Ebook
      </span>

    </a>

  </div>


  <script>

    // ==============================
    // GET PAYMENT DETAILS
    // ==============================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const order_id =
      params.get("order_id");

    const ebook_id =
      params.get("ebook_id");


    const status =
      document.getElementById("status");

    const heading =
      document.getElementById("heading");

    const download =
      document.getElementById("download");


    // ==============================
    // CHECK PARAMETERS
    // ==============================

    if (!order_id) {

      heading.innerHTML =
        "❌ Payment Error";

      status.innerHTML =
        "Order ID नहीं मिला। कृपया दोबारा payment करें।";

    }

    else if (!ebook_id) {

      heading.innerHTML =
        "❌ Payment Error";

      status.innerHTML =
        "Ebook ID नहीं मिली। कृपया दोबारा payment करें।";

    }

    else {

      verifyPayment();

    }


    // ==============================
    // VERIFY PAYMENT
    // ==============================

    async function verifyPayment() {

      try {

        status.innerHTML =
          "⏳ Payment verify ho raha hai...";

        const response =
          await fetch(
            "https://whtiyeyqcvbajschqbli.supabase.co/functions/v1/verify-payment",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                order_id:
                  order_id,

                ebook_id:
                  ebook_id

              })

            }
          );


        const data =
          await response.json();


        // ==============================
        // PAYMENT VERIFIED
        // ==============================

        if (
          response.ok &&
          data.success &&
          data.pdf_url
        ) {

          heading.innerHTML =
            "✅ Payment Verified";

       
status.innerHTML =
  "आपका payment successfully verify हो गया है।<br><br>" +
  "<strong>" +
  (data.title || "Your Ebook") +
  "</strong><br><br>" +
  "<strong>Transaction ID:</strong> " +
  (data.payment_id || "अभी उपलब्ध नहीं") +
  "<br><br>" +
  "नीचे Download Ebook पर क्लिक करें।";


          download.href =
            data.pdf_url;

          download.style.display =
            "inline-block";

        }


        // ==============================
        // PAYMENT NOT COMPLETED
        // ==============================

        else {

          heading.innerHTML =
            "⚠️ Payment Not Verified";

          status.innerHTML =
            data.message ||
            data.error ||
            "Payment अभी verify नहीं हुआ। कृपया कुछ समय बाद दोबारा प्रयास करें।";

        }


      }

      catch (error) {

        console.error(
          "Payment verification error:",
          error
        );

        heading.innerHTML =
          "❌ Verification Error";

        status.innerHTML =
          "Payment verify करते समय समस्या हुई।<br><br>" +
          error.message;

      }

    }

  </script>

</body>

</html>
